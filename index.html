<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Happy Birthday!</title>
  <style>
    :root {
      --bg1: #0f172a; /* slate-900 */
      --bg2: #1e293b; /* slate-800 */
      --accent: #f59e0b; /* amber-500 */
      --text: #f8fafc; /* slate-50 */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #1f2937, transparent),
                  radial-gradient(1000px 700px at 80% 0%, #0ea5e9, transparent),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }

    .container {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: 100%;
      max-width: 860px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 1.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(1.75rem, 6vw, 3rem);
      margin: 0 0 .5rem 0;
      text-align: center;
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.25rem);
      text-align: center;
      margin: 0 0 1rem 0;
    }

    .message {
      font-size: clamp(.95rem, 3.5vw, 1.15rem);
      line-height: 1.65;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 1rem;
      margin: 1rem auto 1.25rem;
    }

    .actions {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .5rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: .65rem 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
      background: #22c55e; /* green-500 */
      color: #0b1220;
      font-size: 1rem;
      box-shadow: 0 6px 16px rgba(34,197,94,0.3);
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-secondary {
      background: #8b5cf6;
      color: white;
      box-shadow: 0 6px 16px rgba(139,92,246,0.35);
    }

    .hint { text-align: center; opacity: .8; font-size: .9rem; margin-top: .5rem; }

    .sky { position: relative; height: 220px; overflow: visible; }
    .balloon {
      position: absolute;
      width: 48px; height: 64px;
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      background: var(--balloon);
      box-shadow: inset -8px -12px 20px rgba(0,0,0,0.25);
      transform-origin: 50% 100%;
      animation: floatUp var(--dur) linear infinite;
      cursor: pointer;
    }
    .balloon::after {
      content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%) rotate(45deg);
      width: 10px; height: 10px; background: var(--balloon); border-radius: 2px;
    }
    .string {
      position: absolute; left: 50%; top: 62px; width: 2px; height: 60px; background: rgba(255,255,255,.3);
      transform: translateX(-50%);
    }
    @keyframes floatUp {
      0% { transform: translateY(30px) rotate(0deg); }
      50% { transform: translateY(-140px) rotate(2deg); }
      100% { transform: translateY(-320px) rotate(-2deg); }
    }
    .popped { animation: none !important; opacity: 0; pointer-events: none; }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    .reveal {
      display: none;
      text-align: center;
      margin-top: 1rem;
      font-weight: 700;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #fbbf24;
      text-shadow: 0 2px 12px rgba(251,191,36,.35);
    }

    footer { text-align: center; opacity: .6; font-size: .8rem; margin-top: .5rem; }
    .credit { opacity: .5; font-size: .75rem; text-align:center; margin-top:.75rem; }
    .code-tip { opacity: .65; font-size: .85rem; text-align:center; }

    @media (max-width: 480px) {
      .actions { flex-direction: column; }
      button { width: 100%; font-size: .95rem; padding: .7rem; }
      .sky { height: 180px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="container">
    <div class="card">
      <h1 id="headline">🎉 Happy Birthday!</h1>
      <p class="subtitle" id="subtitle">Wishing you a day full of smiles, surprises, and lots of cake.</p>

      <div class="message" id="personalMessage"></div>

      <div class="sky" id="sky"></div>

      <div class="actions">
        <button id="playChime">Play birthday chime</button>
        <button class="btn-secondary" id="confettiBurst">Confetti burst</button>
      </div>
      <p class="hint">Tip: Pop a few balloons for a surprise ✨</p>

      <div class="reveal" id="reveal">🎁 Surprise unlocked: Success and happiness is wished for you!</div>

      

  <script>
    const recipientName = "Dear Cousin";
    const personalMessageText = "Another year older, another year wiser! Hope your day is filled with laughter, good coffee, and zero errors. 🎂";

    const headline = document.getElementById('headline');
    const subtitle = document.getElementById('subtitle');
    const personalMessage = document.getElementById('personalMessage');

    headline.textContent = `🎉 Happy Birthday, ${recipientName}!`;
    subtitle.textContent = `A little website gift — made just for you.`;
    personalMessage.textContent = personalMessageText;

    const sky = document.getElementById('sky');
    const colors = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#e11d48', '#22c55e', '#06b6d4'];
    const totalBalloons = 12;
    let poppedCount = 0;
    const revealEl = document.getElementById('reveal');

    function createBalloon(i) {
      const el = document.createElement('div');
      el.className = 'balloon';
      const color = colors[i % colors.length];
      el.style.setProperty('--balloon', color);
      el.style.left = Math.random()*92 + '%';
      el.style.bottom = (-10 - Math.random()*40) + 'px';
      el.style.setProperty('--dur', (10 + Math.random()*10) + 's');

      const string = document.createElement('div');
      string.className = 'string';
      el.appendChild(string);

      el.addEventListener('click', (ev) => {
        popSound();
        burstConfetti(ev.clientX, ev.clientY, 40);
        el.classList.add('popped');
        poppedCount++;
        if (poppedCount >= 5) revealEl.style.display = 'block';
        setTimeout(() => el.remove(), 300);
      });

      return el;
    }

    for (let i=0; i<totalBalloons; i++) {
      sky.appendChild(createBalloon(i));
    }

    setInterval(() => {
      if (document.querySelectorAll('.balloon').length < totalBalloons) {
        sky.appendChild(createBalloon(Math.floor(Math.random()*100)));
      }
    }, 2000);

    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();

    const confetti = [];
    function addConfetti(x, y, n=120) {
      for (let i=0; i<n; i++) {
        confetti.push({
          x: x + (Math.random()*60-30),
          y: y + (Math.random()*20-10),
          r: Math.random()*4+2,
          a: Math.random()*Math.PI*2,
          s: Math.random()*2+1,
          c: colors[Math.floor(Math.random()*colors.length)],
          g: 0.02 + Math.random()*0.04
        });
      }
    }

    function burstConfetti(x, y, n=150) { addConfetti(x, y, n); }

    function tick() {
      ctx.clearRect(0,0,W,H);
      for (let i=confetti.length-1; i>=0; i--) {
        const p = confetti[i];
        p.x += Math.cos(p.a)*p.s*0.7;
        p.y += p.s;
        p.a += 0.02;
        p.s += p.g;
        if (p.y > H + 20) { confetti.splice(i,1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r);
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    tick();

    setInterval(() => addConfetti(Math.random()*W, -10, 8), 300);

    document.getElementById('confettiBurst').addEventListener('click', () => {
      burstConfetti(innerWidth/2, innerHeight*0.25, 250);
    });

    const chimeBtn = document.getElementById('playChime');
    let audioCtx;
    function playNote(freq, time, dur=0.22, type='sine') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime + time;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.start(now); o.stop(now + dur + 0.02);
    }
    function n(note) {
      const A4 = 440, notes = {C: -9, Cs:-8, Db:-8, D:-7, Ds:-6, Eb:-6, E:-5, F:-4, Fs:-3, Gb:-3, G:-2, Gs:-1, Ab:-1, A:0, As:1, Bb:1, B:2};
      return (oct, name) => A4 * Math.pow(2, (notes[name] + 12*(oct-4))/12);
    }
    const f = n();

    chimeBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const seq = [
        [f(5,'C'),0],[f(5,'C'),.3],[f(5,'D'),.6],[f(5,'C'),.9],[f(5,'F'),1.2],[f(5,'E'),1.6],
        [f(5,'C'),2.2],[f(5,'C'),2.5],[f(5,'D'),2.8],[f(5,'C'),3.1],[f(5,'G'),3.4],[f(5,'F'),3.8]
      ];
      seq.forEach(([freq,t])=>playNote(freq,t));
      burstConfetti(innerWidth/2, innerHeight*0.25, 280);
    });

    function popSound(){
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.5, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.15);
    }
  </script>
</body>
</html>
