<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffefd5;
    }

    h1 {
      margin-top: 50px;
      font-size: 2.5em;
      color: #ff4500;
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 60px;
      height: 80px;
      border-radius: 50%;
      background-color: #ff69b4;
      animation: float 6s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100vh); }
    }

    #supra-reveal {
      display: none;
      margin-top: 30px;
    }

    .supra-img {
      max-width: 95%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transform: scale(0.8);
      opacity: 0;
      transition: transform 1s ease, opacity 1s ease;
    }

    .supra-img.show {
      transform: scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday! 🎉</h1>
  <p>Pop all the balloons for a surprise!</p>

  <!-- Balloons -->
  <div class="balloon" style="left:20%; background:#ff4500;"></div>
  <div class="balloon" style="left:40%; background:#32cd32;"></div>
  <div class="balloon" style="left:60%; background:#1e90ff;"></div>
  <div class="balloon" style="left:80%; background:#ff69b4;"></div>

  <!-- Surprise Supra -->
  <div id="supra-reveal">
    <img src="toyota-supra-mk4.png" alt="Supra MK4" class="supra-img">
  </div>

  <script>
    const balloons = document.querySelectorAll('.balloon');
    let popped = 0;

    balloons.forEach(balloon => {
      balloon.addEventListener('click', () => {
        balloon.style.visibility = 'hidden';
        popped++;
        if (popped === balloons.length) {
          // Show Supra after last balloon is popped
          const supraDiv = document.getElementById('supra-reveal');
          supraDiv.style.display = 'block';
          setTimeout(() => {
            supraDiv.querySelector('.supra-img').classList.add('show');
          }, 200);
        }
      });
    });
  </script>
</body>
</html>
